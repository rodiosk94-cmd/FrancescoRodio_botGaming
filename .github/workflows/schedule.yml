name: Automated Gaming News Agent

on:
  schedule:
    # Orari in UTC, uno per l'ora legale e uno per la solare: il passo "Check Italian time"
    # lascia proseguire solo quello giusto, così il report esce sempre alle 06:00 e alle 20:00 italiane.
    - cron: '0 4,18 * * *' # ora legale (UTC+2)
    - cron: '0 5,19 * * *' # ora solare (UTC+1)
  workflow_dispatch: # Permette di avviare l'automazione manualmente con un pulsante
    inputs:
      telegram:
        description: 'Invia il report su Telegram (senza spunta: prova che aggiorna solo Radar, storico intatto)'
        type: boolean
        default: true

permissions:
  contents: write # per salvare stato.json (storico leak e link già inviati) e i dati di Radar nel repo

concurrency:
  group: gaming-news # due esecuzioni insieme si sovrascriverebbero lo storico
  cancel-in-progress: false

jobs:
  run-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 20 # interrompe il job se si blocca, per non consumare minuti
    permissions:
      contents: write
      pages: read # per sapere se Radar è pubblicata e a che indirizzo
    outputs:
      vai: ${{ steps.orario.outputs.vai }}
    steps:
      # Decide in base al cron che ha avviato la run (non all'ora attuale), così un ritardo
      # di GitHub nell'avvio non fa saltare il report.
      - name: Check Italian time
        id: orario
        env:
          CRON: ${{ github.event.schedule }}
        run: |
          OFFSET=$(TZ=Europe/Rome date +%z)
          if [ -z "$CRON" ]; then
            echo "Avvio manuale: procedo"; echo "vai=true" >> "$GITHUB_OUTPUT"
          elif { [ "$CRON" = "0 4,18 * * *" ] && [ "$OFFSET" = "+0200" ]; } || \
               { [ "$CRON" = "0 5,19 * * *" ] && [ "$OFFSET" = "+0100" ]; }; then
            echo "Cron '$CRON' corretto per l'offset $OFFSET: procedo"; echo "vai=true" >> "$GITHUB_OUTPUT"
          else
            echo "Cron '$CRON' non è quello giusto con l'offset $OFFSET: salto"; echo "vai=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout repository
        if: steps.orario.outputs.vai == 'true'
        uses: actions/checkout@v4

      - name: Set up Python
        if: steps.orario.outputs.vai == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        if: steps.orario.outputs.vai == 'true'
        run: |
          pip install google-genai requests

      # Se GitHub Pages è attivo (sorgente: GitHub Actions) il messaggio Telegram linka Radar
      - name: Check Radar
        id: radar
        if: steps.orario.outputs.vai == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          URL=$(gh api "repos/${GITHUB_REPOSITORY}/pages" --jq 'select(.build_type == "workflow") | .html_url' 2>/dev/null || true)
          echo "url=${URL}" >> "$GITHUB_OUTPUT"
          if [ -n "$URL" ]; then echo "Radar: $URL"; else echo "GitHub Pages non attivo: Radar non è ancora pubblicata"; fi

      - name: Run News Generator
        if: steps.orario.outputs.vai == 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RADAR_URL: ${{ steps.radar.outputs.url }}
          INVIA_TELEGRAM: ${{ github.event_name == 'workflow_dispatch' && !inputs.telegram && '0' || '1' }}
        run: python -u Main.py # -u = log in tempo reale

      - name: Save history
        if: steps.orario.outputs.vai == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stato.json
          if [ -d app/data ]; then git add app/data; fi
          if git diff --cached --quiet; then
            echo "Storico invariato"
            exit 0
          fi
          git commit -m "Aggiorna storico leak, notizie inviate e dati di Radar [skip ci]"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

  # Pubblica Radar con i dati appena scritti (salta da solo se GitHub Pages non è attivo)
  deploy-radar:
    needs: run-agent
    if: needs.run-agent.outputs.vai == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy-radar.yml

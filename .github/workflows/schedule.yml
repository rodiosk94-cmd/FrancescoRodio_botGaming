name: Automated Gaming News Agent

on:
  schedule:
    # Orari in UTC. Con l'ora legale: 04:00 e 18:00 UTC = 06:00 e 20:00 in Italia.
    # Dal 25 ottobre (ora solare) cambia in: '0 5,19 * * *'
    - cron: '0 4,18 * * *'
  workflow_dispatch: # Permette di avviare l'automazione manualmente con un pulsante

jobs:
  run-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 20 # interrompe il job se si blocca, per non consumare minuti
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install google-genai requests

      - name: Run News Generator
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -u Main.py # -u = log in tempo reale

